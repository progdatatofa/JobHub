
name: Fetch JobHub Industry Updates

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  fetch-industry-updates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout JobHub
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch industry updates
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python manage.py fetch_industry_updates
