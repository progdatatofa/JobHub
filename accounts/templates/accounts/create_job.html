{% extends 'base.html' %}

{% block title %}Create Job{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <!-- Header -->
            <div class="text-center mb-4">
                <h1 class="fw-bold">Post a New Job</h1>
                <p class="text-muted">
                    Find the right talent by creating a job opportunity on JobHub.
                </p>
            </div>
            {% if error %}
                <div class="alert alert-danger">
                    <i class="bi bi-exclamation-triangle me-1"></i>
                    {{ error }}
                </div>
            {% endif %}

            <!-- Form Card -->
            <div class="card border-0 shadow-sm">

                <div class="card-body p-4 p-md-5">

                    <form method="POST">

                        {% csrf_token %}

                        <!-- Job Title -->
                        <div class="mb-3">
                            <label for="title" class="form-label fw-semibold">
                                Job Title
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="title"
                                name="title"
                                placeholder="e.g. Junior Backend Developer"
                                required
                            >
                        </div>

                        <!-- Company -->
                        <div class="mb-3">
                            <label for="company" class="form-label fw-semibold">
                                Company
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="company"
                                name="company"
                                placeholder="Company name"
                                required
                            >
                        </div>

                        <!-- Description -->
                        <div class="mb-3">
                            <label for="description" class="form-label fw-semibold">
                                Job Description
                            </label>

                            <textarea
                                class="form-control"
                                id="description"
                                name="description"
                                rows="5"
                                placeholder="Describe the role, responsibilities and requirements..."
                                required
                            ></textarea>
                        </div>

                        <!-- Location -->
                        <div class="mb-3">
                            <label for="location" class="form-label fw-semibold">
                                Location
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="location"
                                name="location"
                                placeholder="e.g. Lagos, Nigeria"
                                required
                            >
                        </div>

                        <!-- Job Type -->
                        <div class="mb-3">
                            <label for="job_type" class="form-label fw-semibold">
                                Job Type
                            </label>

                            <select
                                class="form-select"
                                id="job_type"
                                name="job_type"
                                required
                            >
                                <option value="" selected disabled>
                                    Select job type
                                </option>
                                <option value="Full-time">Full-time</option>
                                <option value="Part-time">Part-time</option>
                                <option value="Contract">Contract</option>
                                <option value="Internship">Internship</option>
                                <option value="Remote">Remote</option>
                            </select>
                        </div>

                        <!-- Skills -->
                        <div class="mb-3">
                            <label for="skills" class="form-label fw-semibold">
                                Required Skills
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="skills"
                                name="skills"
                                placeholder="e.g. Python, Django, PostgreSQL"
                                required
                            >
                        </div>

                        <!-- Salary -->
                        <div class="mb-3">
                            <label for="salary" class="form-label fw-semibold">
                                Salary
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="salary"
                                name="salary"
                                placeholder="e.g. ₦200,000 - ₦300,000"
                            >
                        </div>

                        <!-- Deadline -->
                        <div class="mb-4">
                            <label for="application_deadline" class="form-label fw-semibold">
                                Application Deadline
                            </label>

                            <input
                                type="date"
                                class="form-control"
                                id="application_deadline"
                                name="application_deadline"
                            >
                        </div>

                        <!-- Submit -->
                        <button type="submit" class="btn btn-primary w-100 py-2">
                            <i class="bi bi-briefcase-fill"></i>
                            Post Job
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
